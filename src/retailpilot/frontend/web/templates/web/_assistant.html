{% csrf_token %}
{{ assistant|json_script:"assistant-config" }}

<div class="rp-dock" id="rp-dock">
  <button class="rp-toggle" id="rp-toggle" type="button" aria-expanded="false" aria-controls="rp-panel">Ask RetailPilot</button>
  <aside class="rp-panel" id="rp-panel" aria-labelledby="rp-title" hidden>
    <div class="rp-grip" id="rp-grip" role="separator" aria-orientation="vertical" aria-label="Drag to resize RetailPilot" title="Drag to resize"></div>
    <div class="rp-head">
      <div class="rp-head-copy"><span class="assistant-status"><i></i> HERE TO HELP</span><b id="rp-title">Ask RetailPilot</b></div>
      <div class="rp-head-actions" id="rp-history" hidden>
        <select id="rp-threads" aria-label="Previous chats"></select>
        <button class="rp-new" id="rp-new" type="button">New chat</button>
      </div>
      <button class="rp-resize" id="rp-resize" type="button" aria-pressed="false" aria-label="Expand RetailPilot" title="Expand RetailPilot"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="rp-close" id="rp-close" type="button" aria-label="Collapse RetailPilot">&gt;</button>
    </div>
    <div class="rp-msgs" id="rp-messages" aria-live="polite" aria-relevant="additions text"></div>
    <p class="rp-pending" id="rp-pending" aria-live="polite" hidden></p>
    <form class="rp-form" id="rp-form">
      <label class="sr-only" for="rp-input">Ask RetailPilot a question</label>
      <textarea id="rp-input" rows="2" maxlength="2000" autocomplete="off" placeholder="Ask a question (Enter to send, Shift+Enter for a new line)"></textarea>
      <button class="btn" type="submit">Send</button>
    </form>
  </aside>
</div>

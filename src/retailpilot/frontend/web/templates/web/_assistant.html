{% csrf_token %}
{{ assistant|json_script:"assistant-config" }}

<button class="rp-fab" id="rp-fab" type="button" aria-label="Ask RetailPilot" aria-controls="rp-panel" aria-expanded="false" title="Ask RetailPilot">
  <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
</button>

<div class="rp-panel" id="rp-panel" role="dialog" aria-labelledby="rp-title" hidden>
  <div class="rp-head">
    <div class="rp-head-copy"><span class="assistant-status"><i></i> HERE TO HELP</span><b id="rp-title">Ask RetailPilot</b></div>
    <button class="rp-close" id="rp-close" type="button" aria-label="Close">×</button>
  </div>
  <div class="rp-msgs" id="rp-messages" aria-live="polite" aria-relevant="additions text"></div>
  <p class="rp-pending" id="rp-pending" aria-live="polite" hidden></p>
  <form class="rp-form" id="rp-form">
    <label class="sr-only" for="rp-input">Ask RetailPilot a question</label>
    <input id="rp-input" type="text" maxlength="2000" autocomplete="off" placeholder="Ask a question">
    <button class="btn" type="submit">Send</button>
  </form>
</div>

{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RetailPilot{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'web/css/site.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
  <footer class="site-footer">Made by Wi-Fight Club</footer>
  {% if assistant %}
    {% include "web/_assistant.html" %}
    <script src="{% static 'web/js/assistant.js' %}"></script>
  {% endif %}
  {% block scripts %}{% endblock %}
</body>
</html>
